<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Same Day, Two Stories</title>
  <link rel="stylesheet" type="text/css" href="css/styles.css">
</head>
<body>

  <div id="page">
    <h1>Same Day, Two Stories</h1>
    <p id="intro">Same three photos. Switch the order and the story changes.</p>

    <div id="versionButtons">
      <button id="version1Btn">Version 1: Getting It Done</button>
      <button id="version2Btn">Version 2: Putting It Off</button>
    </div>

    <p id="versionLabel">Version 1: Getting It Done</p>
    <p id="stepLabel">Beginning</p>

    <div id="carousel">
      <img id="storyImage" src="images/study.jpg" alt="current story image">
    </div>

    <p id="caption">Back at the desk. Time to actually start.</p>

    <div id="controls">
      <button id="prevBtn">Back</button>
      <button id="nextBtn">Next</button>
    </div>

    <p id="hint">You can also click the image to go forward.</p>
  </div>

  <script src="js/script.js"></script>
</body>
</html>
